apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
android {
    namespace 'com.genymobile.scrcpy'

    compileOptions {
        encoding = "UTF-8"
    }
    compileSdk = 36
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 3
        versionName "1.0.0-SNAPSHOT"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = android.namespace
                artifactId = project.name
                version = "${android.defaultConfig.versionName}"

                from components.release
            }
        }
        repositories {
            mavenLocal()  // this will publish to local Maven repo (~/.m2/repository)
            maven {
                name = "private"
                url = android.defaultConfig.versionName.endsWith("-SNAPSHOT") ?
                        uri("http://repo.dev.sai/repository/maven-snapshots/") :
                        uri("http://repo.dev.sai/repository/maven-releases/")
                allowInsecureProtocol = true
                credentials {
                    username = "admin"
                    password = "admin"
                }
            }
        }
    }
}

